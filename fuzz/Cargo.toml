# Coverage-guided fuzz targets for Heimdall's outside-input parsers (m08-plan U1a; ADR-0014
# section 2). NOT a member of the Heimdall workspace: the empty [workspace] table below makes
# this crate its own workspace, with its own lock file, so the product's pinned stable
# toolchain and Cargo.lock are untouched. It is built only inside the fuzz container
# (fuzz/run-campaign.sh), on a pinned nightly installed in that container only. A finding
# is never evidence by itself: it is minimized and reproduced as a regression test on the
# pinned stable toolchain (tests/adversarial/).
[package]
name = "heimdall-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "1"
heimdall-contract = { path = "../crates/contract" }
heimdall-sshconf = { path = "../crates/sshconf" }
heimdall-ipc = { path = "../crates/ipc" }
heimdall-credential = { path = "../crates/credential" }
heimdall-registry = { path = "../crates/registry" }
heimdall-project = { path = "../crates/project" }
heimdall-runtime = { path = "../crates/runtime" }
heimdall-issuer = { path = "../crates/issuer" }
heimdall-localenv = { path = "../crates/localenv" }
tokio-util = { version = "=0.7.20", default-features = false, features = ["codec"] }
bytes = "1"

[profile.release]
debug = 1
opt-level = 3


[[bin]]
name = "sshconf_parse"
path = "fuzz_targets/sshconf_parse.rs"
test = false
doc = false
bench = false

