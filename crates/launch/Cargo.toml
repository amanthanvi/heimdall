[package]
name = "heimdall-launch"
description = "Heimdall process contract: program resolution without a shell, environment delta, side-channel run records, Unix exec, Windows spawn-and-wait, TUI handoff, and the pre-launch eligibility check (m02-plan U8; ADR-0007 §8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
heimdall-localenv = { workspace = true }
thiserror = { workspace = true }
# U8 windows::spawn_and_wait: the console control guard (tokio ctrl_c/ctrl_break).
tokio = { workspace = true }
# ADR-0007 §12.15 item 7 (U8 E3): the run-record encoder (workspace-pinned).
serde_json = { workspace = true }

[dev-dependencies]
# The eligibility properties (m02-plan §0: proptest, ≥ 256 cases, fixed seed) and
# their time arithmetic; both workspace-pinned.
proptest = { workspace = true }
jiff = { workspace = true }
