[package]
name = "heimdall-store"
description = "Heimdall transactional local state: SQLite journal, idempotency, grants, tombstones, resource generations, events, time anchors (spec §13.3, P08)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# ⟨M07 W10 U3-2⟩ Test support only (`Txn::damage_document_for_test`): enabled by dev-dependencies,
# never by a product build; the release gate checks the release graph does not enable it.
test-support = []

[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
# ⟨M08 U2b-1⟩ The generation layout (ADR-0014 §3.6, H12): the pointer switch, the operation
# record, the staging intent and start-up recovery. ⟨M08 U2b-2⟩ Also the request ledger, keyed
# by the store's digest of the full idempotency key (`fence`).
heimdall-stategen = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# ⟨rev7⟩ The repository root for the replay corpus (HM_REPO_ROOT; ADR-0007 §12.32 item 3). A
# dev-dependency cycle like heimdall-contract's: default features off, no store graph.
heimdall-testkit = { workspace = true, default-features = false }

# Joint wave 0 of M04/M05: migrations 0007/0008 and the ext_m04/ext_m05 methods.
[[test]]
name = "integration_store_m04_m05"
path = "../../tests/integration/store_m04_m05.rs"

# ⟨rev7⟩ The replay corpus (ADR-0013 §1.3; m07-plan U0): rows written by earlier exit builds,
# migrated forward and read back through revision 7's readers.
[[test]]
name = "contracts_replay"
path = "../../tests/contracts/replay.rs"

# ⟨M08 U2b-1⟩ The generation layout of the real store (ADR-0014 §3.6, H12): the switch's
# fault set, the pointer as the only authority, adoption against an older build, copies
# through SQLite, and the tests/** path guard.
[[test]]
name = "adversarial_store_generations"
path = "../../tests/adversarial/store_generations.rs"
