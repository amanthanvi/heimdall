[package]
name = "heimdall-transport-iroh"
description = "Heimdall Iroh transport (M06; ADR-0012 §1-§2): the /pigeons/0 connect and serve legs and the exposure policy. Skeleton; the iroh feature is compile-checked only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Production edges (m06-plan U0): contract only (tools/validation/crate_graph.py refuses any
# other workspace edge). The default build has no iroh at all.
[dependencies]
heimdall-contract = { workspace = true }
# Feature `iroh` only (ADR-0012 §1 item 1; dependencies.md): exact pin, TLS through ring,
# no default features (no relay server, no portmapper, no n0 presets by default).
iroh = { workspace = true, optional = true }
# netdev is declared only so `netdev/hm-no-route-probe` can reach the copy iroh's netwatch
# uses through feature unification. The `[patch.crates-io]` in the root manifest points it at
# the vendored, patched source (third_party/netdev-0.47.0; ADR-0012 §1 item 3, ruling Q8).
netdev = { workspace = true, optional = true }

[features]
default = []
# Embeds iroh and applies the netdev patch (the default-route probe is removed).
iroh = ["dep:iroh", "dep:netdev", "netdev/hm-no-route-probe"]
