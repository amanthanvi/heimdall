[package]
name = "heimdall-credential"
description = "Heimdall managed credential core (m03-plan U1, U2; ADR-0008 D1, D2, D6 item 2): the key vault, certificate profile and validator, userauth purpose parsing, session-bind, the signer and its endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Production edges (m03-plan §0.6): contract, domain, ipc (the Signer trait and the
# listeners), app (SignatureAuthority, SignPermit, VerificationEndpoints).
[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
heimdall-ipc = { workspace = true }
heimdall-app = { workspace = true }
# ADR-0008 §18 (dependencies.md §5): Ed25519 K_env/K_verify generation and
# certificates (the root pin carries `ed25519`, `encryption`, `rand_core`).
# M03-U1 (ADR-0008 D2 item 5): `crypto` (p256/p384/p521/rsa verification) for the
# session-bind host keys (Ed25519, ECDSA, RSA). Named here so the crate does not rely on
# feature unification through ssh-agent-lib; every package was already in the lock.
ssh-key = { workspace = true, features = ["crypto"] }
# M03-U1 (ADR-0008 D2 item 4): the userauth purpose parser reads with ssh-encoding only.
ssh-encoding = { workspace = true }
# M03-U1 (ADR-0008 D2 item 5): the `session-bind@openssh.com` message type.
ssh-agent-lib = { workspace = true }
# M03-U1 (m03-plan U0b row 16): the debug-build seeded key derivation.
sha2 = { workspace = true }
# ADR-0008 D1: SecretKey and SecretCaKey zeroize on drop.
zeroize = { workspace = true }
# M03 wave 1 (ADR-0008 §17.15 item 11, D-Q3): key generation, serials, vault handles and
# backup salts come only from the OS CSPRNG through getrandom (`vault::SystemRng`).
# Already pinned in the workspace; no package enters the lock.
getrandom = { workspace = true }
thiserror = { workspace = true }

# U1's `sys.rs` memory protection (dependencies.md §5; question D Q4).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }            # mlock/munlock, prctl(PR_SET_DUMPABLE), setrlimit(RLIMIT_CORE)

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }     # VirtualLock/VirtualUnlock (Win32_System_Memory, root list)

[dev-dependencies]
# M03 wave 1 (m03-plan U1 "Tests"): the U7/U11 process fixtures (loopback sshd, counting
# proxy, scratch home), fixed-seed properties and scratch directories. A dev-dependency
# cycle through heimdall-testkit's optional `managed` edge, as for heimdall-ipc.
heimdall-testkit = { workspace = true, features = ["fixtures"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
# M03-U1: the compile-fail doc tests that `vault::SecretKey` is neither `Serialize` nor
# `Deserialize` (with a compiling control), m03-plan U1 `secret_key_has_no_clone_debug_serialize`.
serde = { workspace = true }

# Test targets (m01-plan §0 convention): real `[[test]]` targets under `tests/`.
# M03-U1: certificate profile and validator, purpose parsing, session-bind.
[[test]]
name = "integration_credential_cert"
path = "../../tests/integration/credential_cert.rs"

# M03-U1: vault and memory protection.
[[test]]
name = "integration_credential_memory"
path = "../../tests/integration/credential_memory.rs"

# M03-U1: adversarial userauth and session-bind requests (proptest, fixed seed).
[[test]]
name = "adversarial_signer_requests"
path = "../../tests/adversarial/signer_requests.rs"
