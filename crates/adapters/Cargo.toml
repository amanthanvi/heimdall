[package]
name = "heimdall-adapters"
description = "Heimdall existing-access credential adapters: the native SSH agent and the 1Password SSH agent, their passive detection, interaction states and consumer integration (m02-plan U6; ADR-0007 §7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
# The ports these adapters implement (`CredentialAdapter`, `ProviderProbe`).
heimdall-app = { workspace = true }
# `ipc::agent_client` (U6): the bounded `SSH_AGENTC_REQUEST_IDENTITIES` client.
heimdall-ipc = { workspace = true }
# Passive endpoint detection and the static identity selection (U3).
heimdall-localenv = { workspace = true }
# M03 (m03-plan §0.6; ADR-0008 §18): the managed adapter (ManagedEffects) drives the
# signer table and key vault.
heimdall-credential = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
heimdall-testkit = { workspace = true }

# Test targets hosted here (convention, m01-plan.md §0; review F09): real Cargo
# `[[test]]` targets whose sources live under the repository `tests/` tree.

# M02-U6 existing-access adapters at fixture level (A11, A35; the FakeAgent and,
# on Unix, the disposable ssh-agent from heimdall-testkit, U7).
[[test]]
name = "integration_adapters"
path = "../../tests/integration/adapters.rs"
