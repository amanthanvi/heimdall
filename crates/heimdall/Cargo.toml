# host), `windows` (U2, Windows only: handle lists, the A14 inventory, the Git client
# finding).
[[test]]
name = "e2e_platform_m04"
path = "../../tests/e2e/platform_m04.rs"

# ⟨M04 U3a⟩ The projection transaction across the `heimdall-wsl/1` channel with the real
# `heimdall` binary as the helper (M04-D02; ADR-0010 §9 items 2 and 8).
[[test]]
name = "integration_wsl_helper_channel"
path = "../../tests/integration/wsl_helper_channel.rs"

# ⟨M04 U6⟩ Bastion routes, explicit agent forwarding and route-aware evidence through the real
