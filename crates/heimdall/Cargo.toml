[package]
name = "heimdall"
description = "Heimdall binary: CLI, TUI entry point, and `heimdall service run` (spec §11.1, §13.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "heimdall"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
heimdall-app = { workspace = true }
heimdall-ipc = { workspace = true }
heimdall-runtime = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# M01-U9 test adapter wiring (m01-plan U9): the fake credential adapter, scripted
# time sync and stage hook are referenced only from `src/testcfg.rs` under
# `cfg(debug_assertions)` and only when a `HEIMDALL_TEST_*` variable is set. A
# release build never references the crate (so nothing of it is linked) and
# refuses the variables. Default features off (M02 wave-1 integrator finding B):
# the U7 process fixtures (`fixtures`) stay out of the production build graph.
heimdall-testkit = { workspace = true, default-features = false, features = ["app"] }

[dev-dependencies]
tempfile = { workspace = true }

# M01-U9 CLI end-to-end suite (A19/A06 CLI variants) through the real binary.
[[test]]
name = "e2e_cli_m01"
path = "../../tests/e2e/cli_m01.rs"
