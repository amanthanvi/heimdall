[package]
name = "heimdall"
description = "Heimdall binary: CLI, TUI entry point, and `heimdall service run` (spec §11.1, §13.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "heimdall"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
heimdall-app = { workspace = true }
heimdall-ipc = { workspace = true }
heimdall-runtime = { workspace = true }
# ⟨M02⟩ U8 `run`/`connect` (m02-plan U8): the process contract, and the local
# environment for the static selection pass, Git resolution and client discovery.
heimdall-launch = { workspace = true }
heimdall-localenv = { workspace = true }
# ⟨M02⟩ U9 `doctor` and `setup status` read the store read-only (`Store::open_read_only`).
heimdall-store = { workspace = true }
# ⟨M02⟩ U9 `uninstall` finds a Heimdall include block left in the user file.
heimdall-sshconf = { workspace = true }
# M03 (m03-plan §0.6; ADR-0008 §18): the issuer ceremonies and `internal issuer`,
# and the CLI-side SshStepRunner.
heimdall-issuer = { workspace = true }
heimdall-enroll = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# ⟨M02⟩ U10 `tui` (m02-plan U10): Ratatui with its crossterm backend, workspace-pinned
# (docs/architecture/dependencies.md: enters the lock when the TUI consumes it).
ratatui = { workspace = true }
# M01-U9 test adapter wiring (m01-plan U9): the fake credential adapter, scripted
# time sync and stage hook are referenced only from `src/testcfg.rs` under
# `cfg(debug_assertions)` and only when a `HEIMDALL_TEST_*` variable is set. A
# release build never references the crate (so nothing of it is linked) and
# refuses the variables. Default features off (M02 wave-1 integrator finding B):
# the U7 process fixtures (`fixtures`) stay out of the production build graph.
heimdall-testkit = { workspace = true, default-features = false, features = ["app"] }

[target.'cfg(unix)'.dependencies]
# ⟨M02⟩ U10 `tui` (Unix): the terminal is read with `poll`/`read` and sized with
# `tcgetwinsize`, and raw mode is set and restored with `tcgetattr`/`tcsetattr`, all
# through rustix's safe wrappers (workspace-pinned), never through crossterm's event
# source or `terminal::size()` (prototypes/rust/REPORT.md §5, §9 K16).
rustix = { workspace = true, features = ["event", "termios"] }

[dev-dependencies]
tempfile = { workspace = true }
# Property tests (fixed seed, >= 256 cases), as in the other crates.
proptest = { workspace = true }
# M02-U8 `e2e_run_m02` (tests only): the U7 process fixtures (scratch home, fake agent).
# Test builds only; the production graph keeps default features off (finding B).
heimdall-testkit = { workspace = true, default-features = false, features = ["app", "fixtures"] }
# The A11 cases seed a standing policy into the in-process runtime's store.
heimdall-store = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# M02-U8 `a27_ctrl_c_reaches_child_once` and `a27_resize_reaches_child`: a pty through
# rustix's safe wrappers (workspace-pinned; dev-only features).
rustix = { workspace = true, features = ["pty", "termios", "process", "stdio"] }

# M01-U9 CLI end-to-end suite (A19/A06 CLI variants) through the real binary.
[[test]]
name = "e2e_cli_m01"
path = "../../tests/e2e/cli_m01.rs"

# M02-U8 `run`/`connect` end-to-end suite (m02-plan U8: A27, A11, R-RT-05, holders, Git
# under `run`) through the real binary.
[[test]]
name = "e2e_run_m02"
path = "../../tests/e2e/run_m02.rs"

# M02-U9 CLI end-to-end suite (m02-plan U9: setup, doctor, catalog, uninstall; A01, A11,
# A21, A22, A35) through the real binary against an in-process runtime.
[[test]]
name = "e2e_cli_m02"
path = "../../tests/e2e/cli_m02.rs"

# M02-U10 TUI end-to-end suite (m02-plan U10: search never probes, the connect handoff,
# panic and hang-up restoration, no cursor query, the decision and authorization
# confirmations, the Ctrl-Z job, first-frame latency) through the real binary on a pty.
[[test]]
name = "e2e_tui_m02"
path = "../../tests/e2e/tui_m02.rs"

# M03 wave 0 (U0 §5 item 24, U0b row 16): the M03 command tree and its fail-closed handlers through the real binary.
[[test]]
name = "e2e_cli_m03"
path = "../../tests/e2e/cli_m03.rs"

# M03-U4: the owner-present issuer ceremonies through a pty (A33: the passphrase only on
# the terminal transcript).
[[test]]
name = "e2e_issuer_ceremony"
path = "../../tests/e2e/issuer_ceremony.rs"

# M03 wave 2 (U8): consumer integration for managed pairs (connect, run, the slot check;
# m03-plan U8 "Tests").
[[test]]
name = "e2e_consumer_m03"
path = "../../tests/e2e/consumer_m03.rs"
