path = "../../tests/e2e/cli_m05.rs"

# ⟨M05⟩ Ruling I-13, option 2 (ADR-0011 §3.2 (a), §10 item 3): `activate --hook` warms the
# personal default, so the first ordinary `ssh` logs in, through the real binary on a loopback
