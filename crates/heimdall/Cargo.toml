[package]
name = "heimdall"
description = "Heimdall binary: CLI, TUI entry point, and `heimdall service run` (spec §11.1, §13.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "heimdall"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
heimdall-app = { workspace = true }
heimdall-ipc = { workspace = true }
heimdall-runtime = { workspace = true }
# ⟨M02⟩ U8 `run`/`connect` (m02-plan U8): the process contract, and the local
# environment for the static selection pass, Git resolution and client discovery.
heimdall-launch = { workspace = true }
heimdall-localenv = { workspace = true }
# ⟨M02⟩ U9 `doctor` and `setup status` read the store read-only (`Store::open_read_only`).
heimdall-store = { workspace = true }
# ⟨M02⟩ U9 `uninstall` finds a Heimdall include block left in the user file.
heimdall-sshconf = { workspace = true }
# M03 (m03-plan §0.6; ADR-0008 §18): the issuer ceremonies and `internal issuer`,
# and the CLI-side SshStepRunner.
heimdall-issuer = { workspace = true }
heimdall-enroll = { workspace = true }
# M04 (ADR-0010 §2–§3; joint wave 0): `wsl enable|disable|status` and the hidden `internal wsl-helper`.
heimdall-wsl = { workspace = true }
# ⟨M06 U2⟩ `environment` and `device` (m06-plan U2): K_mgmt custody, its per-session agent and
# signer (`heimdall_credential::mgmt`), and the controller ports' async traits. Both already
# in the production graph (heimdall-runtime depends on them); no package enters the lock.
heimdall-credential = { workspace = true }
async-trait = { workspace = true }
# ⟨M06 W2 wiring⟩ `remote init`'s management line (`heimdall_remote::line`). Already in the
# production graph (heimdall-runtime depends on it); no package enters the lock.
heimdall-remote = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# ⟨M06 W2 wiring⟩ `io-std`: `remote serve` bridges its standard streams asynchronously (a
# feature of the pinned crate; no package enters the lock).
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# ⟨M02⟩ U10 `tui` (m02-plan U10): Ratatui with its crossterm backend, workspace-pinned
# (docs/architecture/dependencies.md: enters the lock when the TUI consumes it).
ratatui = { workspace = true }
# M01-U9 test adapter wiring (m01-plan U9): the fake credential adapter, scripted
# time sync and stage hook are referenced only from `src/testcfg.rs` under
# `cfg(debug_assertions)` and only when a `HEIMDALL_TEST_*` variable is set. A
# release build never references the crate (so nothing of it is linked) and
# refuses the variables. Default features off (M02 wave-1 integrator finding B):
# the U7 process fixtures (`fixtures`) stay out of the production build graph.
# ⟨M03⟩ wave 4 (U3-Q4, ADR-0008 §17.19 item 6): `managed` so the debug-build
# `internal issuer` can select `ScratchSecretStore` under `cfg(debug_assertions)`.
# ⟨M08 U3c; m08-plan Q8, ADR-0014 §4.5, H11⟩ Optional, behind the default feature
# `test-config`. The release scripts build with `--no-default-features`, so a release build's
# graph holds neither this crate nor what only it brings in (proptest, tempfile and the rest:
# `release_graph_holds_no_test_only_crate`). A debug build needs the feature (main.rs says so
# at compile time); every use is under `cfg(debug_assertions)` or `cfg(test)`.
heimdall-testkit = { workspace = true, default-features = false, features = ["app", "managed"], optional = true }

[features]
# ⟨M08 U3c⟩ The debug-build test configuration's edge to the test kit (above). Release
# artifacts are built without default features.
default = ["test-config"]
test-config = ["dep:heimdall-testkit"]
# ⟨M06 W3⟩ ADR-0012 §1 item 1: the Iroh transport in this binary (the supervised serve child
# `transport serve` and the route helper's Iroh leg). Without it the serve child refuses
# (`driver_unavailable`). The route helper never dials an Iroh leg: it records the leg's
# attempt as `driver_unavailable` (route.health) and fails over
# to the destination's direct and jump legs, which are unaffected. A destination whose every
# leg is Iroh is refused `CAPABILITY_UNAVAILABLE` / `driver_unavailable` with the Iroh
# preview message, after its attempts are recorded. Which release builds enable it is the
# distribution's decision (ADR-0012 §1, §2.6).
iroh = ["heimdall-runtime/iroh"]

[target.'cfg(unix)'.dependencies]
# ⟨M02⟩ U10 `tui` (Unix): the terminal is read with `poll`/`read` and sized with
# `tcgetwinsize`, and raw mode is set and restored with `tcgetattr`/`tcsetattr`, all
# through rustix's safe wrappers (workspace-pinned), never through crossterm's event
# source or `terminal::size()` (prototypes/rust/REPORT.md §5, §9 K16).
rustix = { workspace = true, features = ["event", "termios"] }

[dev-dependencies]
tempfile = { workspace = true }
# ⟨M04 U4a⟩ `integration_wsl_helper_channel`'s Mode B relay test implements `ipc::signing::Signer`.
async-trait = { workspace = true }
# Property tests (fixed seed, >= 256 cases), as in the other crates.
proptest = { workspace = true }
# M02-U8 `e2e_run_m02` (tests only): the U7 process fixtures (scratch home, fake agent).
# Test builds only; the production graph keeps default features off (finding B).
heimdall-testkit = { workspace = true, default-features = false, features = ["app", "fixtures", "managed"] }
# The A11 cases seed a standing policy into the in-process runtime's store.
heimdall-store = { workspace = true }
# ⟨M03⟩ wave 4, round 2 (R2-E; ADR-0008 §17.21 items 1, 11): `e2e_enroll_m03`'s ensure and
# ssh legs run the real managed adapter, effects, signer table and binding endpoints
# (workspace crates only, already in the production graph through `heimdall-runtime`).
heimdall-adapters = { workspace = true }
heimdall-credential = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# ⟨M04 U2⟩ `e2e_platform_m04`'s `windows` module (tests only): the handle probe's three Win32 calls (`SetHandleInformation`,
# `GetHandleInformation`, `GetFinalPathNameByHandleW`); the workspace pin, already in the lock.
windows-sys = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# M02-U8 `a27_ctrl_c_reaches_child_once` and `a27_resize_reaches_child`: a pty through
# rustix's safe wrappers (workspace-pinned; dev-only features).
rustix = { workspace = true, features = ["pty", "termios", "process", "stdio"] }

# M01-U9 CLI end-to-end suite (A19/A06 CLI variants) through the real binary.
[[test]]
name = "e2e_cli_m01"
path = "../../tests/e2e/cli_m01.rs"

# M02-U8 `run`/`connect` end-to-end suite (m02-plan U8: A27, A11, R-RT-05, holders, Git
# under `run`) through the real binary.
[[test]]
name = "e2e_run_m02"
path = "../../tests/e2e/run_m02.rs"

# M02-U9 CLI end-to-end suite (m02-plan U9: setup, doctor, catalog, uninstall; A01, A11,
# A21, A22, A35) through the real binary against an in-process runtime.
[[test]]
name = "e2e_cli_m02"
path = "../../tests/e2e/cli_m02.rs"

# M02-U10 TUI end-to-end suite (m02-plan U10: search never probes, the connect handoff,
# panic and hang-up restoration, no cursor query, the decision and authorization
# confirmations, the Ctrl-Z job, first-frame latency) through the real binary on a pty.
[[test]]
name = "e2e_tui_m02"
path = "../../tests/e2e/tui_m02.rs"

# M03 wave 0 (U0 §5 item 24, U0b row 16): the M03 command tree and its fail-closed handlers through the real binary.
[[test]]
name = "e2e_cli_m03"
path = "../../tests/e2e/cli_m03.rs"

# M03-U4: the owner-present issuer ceremonies through a pty (A33: the passphrase only on
# the terminal transcript).
[[test]]
name = "e2e_issuer_ceremony"
path = "../../tests/e2e/issuer_ceremony.rs"

# M03 wave 2 (U8): consumer integration for managed pairs (connect, run, the slot check;
# m03-plan U8 "Tests").
[[test]]
name = "e2e_consumer_m03"
path = "../../tests/e2e/consumer_m03.rs"

# M03-U7 the deadline behaviour of owned connections through the real binary
# (m03-plan U7; ADR-0008 D8).
[[test]]
name = "e2e_deadline_m03"
path = "../../tests/e2e/deadline_m03.rs"

# ⟨M03⟩ wave 4 (U10): the managed-credential and enrollment end-to-end flows
# (m03-plan U10 "Tests").
[[test]]
name = "e2e_managed_m03"
path = "../../tests/e2e/managed_m03.rs"

[[test]]
name = "e2e_enroll_m03"
path = "../../tests/e2e/enroll_m03.rs"

# ⟨M03⟩ wave 5 (U12): the TUI's M03 views through the real binary (m03-plan U12 "Tests").
[[test]]
name = "e2e_tui_m03"
path = "../../tests/e2e/tui_m03.rs"

# ⟨M03⟩ wave 6 (U13): the exit suite through the real binary and its real issuer child
# (ADR-0008 §17.26 item 3; m03-plan U13, §3 rows A07, A10, A33).
[[test]]
name = "e2e_exit_m03"
path = "../../tests/e2e/exit_m03.rs"

# ⟨M05⟩ wave 4 (U10; ruling I-16): the M05 exit rows A02, A04's default row, A16, A28's
# managed rows and U5 through the real binary, on M03's exit world.
[[test]]
name = "e2e_exit_m05"
path = "../../tests/e2e/exit_m05.rs"

# M04/M05 joint wave 0 (ADR-0010 §9 items 8-9; ADR-0011 §10 items 8-10): every new command
