[[test]]
name = "e2e_environment_cli_m06"
path = "../../tests/e2e/environment_cli_m06.rs"

# ⟨M06 W2 wiring⟩ A controller's management session to a real runner: `remote init` on a
# pseudo-terminal, `service run --runner`, a fixture sshd whose line runs the real `remote
# serve`, and the controller's isolated configuration, K_mgmt agent and IPC client.
[[test]]
name = "e2e_environment_runner_m06"
path = "../../tests/e2e/environment_runner_m06.rs"

# ⟨M06 W5 U7⟩ The M06 exit journeys through the real binaries (m06-plan §1 U7, §3): a runner
