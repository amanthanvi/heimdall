[package]
name = "heimdall-project"
description = "Heimdall trusted-work project logic (M05; ADR-0011 §2.2-§2.4): the pure manifest parser, access digest, workspace discovery over an FsView, match_workspace, and the portable bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Production edges (ADR-0011 §2): contract and domain only. The crate-graph step
# (tools/validation/crate_graph.py) refuses any other workspace edge: project is pure.
[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
serde = { workspace = true }
# The raw JSON walk of the portable bundle (authority sections at any depth) and the
# `Capability` name check both go through `serde_json::Value`.
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# The manifest's value tree: duplicate keys are a syntax error in the `toml` crate, and the
# authority-vocabulary scan walks the tree before the closed-schema decode.
toml = { workspace = true }

[dev-dependencies]
# U1 tests: fixed-seed properties over the pure API (ADR-0009 §2.3).
proptest = { workspace = true }
serde_json = { workspace = true }

# The lib has no unit tests: every claim is in the model target below (a test target that
# runs zero tests fails `tools/validation/check.sh`).
[lib]
test = false
doctest = false

# M05 wave 1 (U1): the manifest parser, the access digest, workspace discovery and
# `match_workspace` over an in-memory `FsView`, and the portable bundle.
[[test]]
name = "model_project_pure"
path = "../../tests/model/project_pure.rs"
