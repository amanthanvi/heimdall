[package]
name = "heimdall-ipc"
description = "Heimdall local IPC: owner-only Unix sockets / named pipes with peer checks, length-prefixed JSON framing, hello negotiation, bounded SSH-agent signing framer (spec §13.2; ADR-0006 §2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
heimdall-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ssh-agent-lib = { workspace = true }
ssh-key = { workspace = true }
ssh-encoding = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# Canary helper, VirtualClock and strategies only: no store/app graph in the IPC
# test build or the Windows cross-check (wave-1 E2).
heimdall-testkit = { workspace = true, default-features = false }
# Paused virtual time for idle-timeout and hello-timeout tests (wave-1 E2).
tokio = { workspace = true, features = ["test-util"] }

# Test targets hosted here (convention, m01-plan.md §0; review F09): real Cargo
# `[[test]]` targets whose sources live under the repository `tests/` tree. Items they
# need beyond the supported API are `#[doc(hidden)] pub` in the library.

# M01-U6 Unix endpoint and session integration over real sockets. The file is
# `#![cfg(unix)]`, so on Windows the target builds with zero tests.
[[test]]
name = "integration_ipc_unix"
path = "../../tests/integration/ipc_unix.rs"

# M01-U6 control-endpoint framing under adversarial input (all platforms).
[[test]]
name = "adversarial_ipc_frames"
path = "../../tests/adversarial/ipc_frames.rs"

# M01-U7 signing-endpoint SSH-agent framer under adversarial input (all platforms).
[[test]]
name = "adversarial_agent_frames"
path = "../../tests/adversarial/agent_frames.rs"
