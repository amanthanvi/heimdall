[package]
name = "heimdall-runtime"
description = "Heimdall per-user runtime: config, single-instance lock, service loop, supervisor, deadline scheduler, on-demand start (spec §13.1, P01; plan §4.1 Runtime/reconciler)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
heimdall-store = { workspace = true }
heimdall-app = { workspace = true }
heimdall-ipc = { workspace = true }
# ⟨M02⟩ U5 (m02-plan U5): `Service::start` wires the projection writer and its
# cleaner (`heimdall-localenv`) and the existing-access adapters (`heimdall-adapters`).
heimdall-localenv = { workspace = true }
heimdall-adapters = { workspace = true }
# M03 (m03-plan §0.6; ADR-0008 §18): the signer and endpoints, the issuer client and
# supervision, the verifier (VerificationRunner).
heimdall-credential = { workspace = true }
heimdall-issuer = { workspace = true }
heimdall-enroll = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
etcetera = { workspace = true }

# platform.rs: continuous clock and boot ID (ADR-0005 §3.6). Unix: clock_gettime /
# mach_continuous_time / sysctlbyname through libc; Windows: QueryInterruptTime and
# the Session Manager BootId registry value through windows-sys.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# M03-U9: `Win32_Graphics_Gdi` gates `WNDCLASSW`/`RegisterClassW` (the session-lock
# message-only window, `session_lock/sys.rs`). A feature of the pinned crate only.
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi"] }

# M03 (ADR-0008 §18; dependencies.md §5): the session-lock source (U9).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }            # logind LockedHint + Lock/Unlock

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
core-foundation-sys = { workspace = true }

[dev-dependencies]
# M03 wave 0 (A2-Q1): virtual time (`tokio::time::pause`) for the deterministic signing-gate and
# narrowing tests (U0b rows 20, 24). A feature of a pinned crate; no package enters the lock.
tokio = { workspace = true, features = ["test-util"] }
heimdall-testkit = { workspace = true, features = ["managed"] }
tempfile = { workspace = true }
# Gap G11: the U5t time-gate sweep is a fixed-seed proptest with Cutoff steps.
proptest = { workspace = true }

# M01-U5t time gate wiring: A08 cases through TimeGate + store.
[[test]]
name = "model_timegate"
path = "../../tests/model/timegate.rs"

# M01-U8a runtime foundations: paths, config, instance info, redaction, platform clock.
[[test]]
name = "integration_runtime"
path = "../../tests/integration/runtime.rs"

# M01-U5 application operations: A06/A19/A29 model cases and pipeline fault points.
[[test]]
name = "model_operations"
path = "../../tests/model/operations.rs"

# M01-U5 events, cursors and subscriptions (A19 event cases).
[[test]]
name = "model_events"
path = "../../tests/model/events.rs"

# M02-U5 setup and catalog drivers (m02-plan U5): decisions, consent, held
# operations and their repairs, restart reconciliation, through the real Operations
# and the runtime's projection writer over a scratch home.
[[test]]
name = "model_setup"
path = "../../tests/model/setup.rs"

# M02-U5 end to end through the real dispatcher, sessions and service (m02-plan U5,
# M2-D08).
[[test]]
name = "e2e_setup_dispatch"
path = "../../tests/e2e/setup_dispatch.rs"

# M03 wave 0 (U0b rows 2-4, 9-12, 19, 21, 22): issuance, verification, ensure resolution, policy, catalog through the real Operations.
[[test]]
name = "model_operations_m03"
path = "../../tests/model/operations_m03.rs"

# M03 wave 0 (U0b rows 5, 7, 20, 25-27): signature authorization and the narrowing protocol through the real Operations.
[[test]]
name = "model_narrowing_m03"
path = "../../tests/model/narrowing_m03.rs"

# M03 wave 0 (U0b rows 6, 8, 13, 14, 17, 18, 23, 28): dispatch fail-closed landing, restart recovery, supervisor passes, procstat.
[[test]]
name = "integration_runtime_m03"
path = "../../tests/integration/runtime_m03.rs"

# M03-U9: the session-lock sources (fixture and native rows).
[[test]]
name = "integration_session_lock"
path = "../../tests/integration/session_lock.rs"
