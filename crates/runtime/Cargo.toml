[package]
name = "heimdall-runtime"
description = "Heimdall per-user runtime: config, single-instance lock, service loop, supervisor, deadline scheduler, on-demand start (spec §13.1, P01; plan §4.1 Runtime/reconciler)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
heimdall-contract = { workspace = true }
heimdall-domain = { workspace = true }
heimdall-store = { workspace = true }
heimdall-app = { workspace = true }
heimdall-ipc = { workspace = true }
# ⟨M02⟩ U5 (m02-plan U5): `Service::start` wires the projection writer and its
# cleaner (`heimdall-localenv`) and the existing-access adapters (`heimdall-adapters`).
heimdall-localenv = { workspace = true }
heimdall-adapters = { workspace = true }
# M03 wave 3 (U7, reading R4; U7-Q1): the owned master's argv uses the command-line half
# of P's directive set (`heimdall_sshconf::render::{OWNED_LAUNCH_PINS,
# managed_identity_options}`), never retyped. sshconf is already in runtime's graph through
# localenv (contract, domain only): no package enters the lock and no cycle forms.
heimdall-sshconf = { workspace = true }
# M03 (m03-plan §0.6; ADR-0008 §18): the signer and endpoints, the issuer client and
# supervision, the verifier (VerificationRunner).
heimdall-credential = { workspace = true }
heimdall-issuer = { workspace = true }
heimdall-enroll = { workspace = true }
# M04 (ADR-0010 §2–§3; joint wave 0): the WSL realization; the runtime wires it (app never imports it).
heimdall-wsl = { workspace = true }
# ⟨M05⟩ U4 (ADR-0011 §2.2–§2.3): the workspace observer implements the project crate's
# `FsView` and the app's `WorkspaceProbe` (`workspace_observe.rs`).
heimdall-project = { workspace = true }
# ⟨M06⟩ W2 (ADR-0012 §3, §13; m06-plan U1): the runner runtime wires remote access (the
# role table, the per-frame check, invitations, runner-local widening) into its dispatcher
# (`paired.rs`). The crate graph allows the edge (remote never depends on the runtime); no
# third-party package enters the lock.
heimdall-remote = { workspace = true }
# ⟨M06 W3⟩ (ADR-0012 §3.5 ⟨2026-11-21⟩, ruling 8 (c)): `paired_lines` writes the management
# line through the one authorized_keys safety module, `heimdall_registry::keys_file`. The
# registry depends on contract and domain only, and is already in the runtime's graph through
# app and enroll: only the edge is new, and no cycle can form.
heimdall-registry = { workspace = true }
# ⟨M06 U56⟩ (ADR-0012 §1-§2, §13; m06-plan U56): the runtime supervises the Iroh serve child
# and holds the admission authority (`supervise_transport.rs`), and gives the route helper its
# Iroh leg. The crate graph allows the edge (the transport depends on the contract only; app
# never imports it). Without feature `iroh` the transport is compiled without iroh and every
# Iroh path fails closed (`driver_unavailable`). No package enters the lock.
heimdall-transport-iroh = { workspace = true }
# ⟨M06 U56⟩ The supervisor implements heimdall-app's async ports (`ServeControl`,
# `IrohLegDialer`); already in the lock through heimdall-app.
async-trait = { workspace = true }
# ⟨M06 W3⟩ The runner's signer table installs the certificates runner issuance accepted
# (`runner_issuance.rs`; `SignerTable::install` takes a parsed certificate). Already in the lock
# through heimdall-credential: only the edge is new.
ssh-key = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
etcetera = { workspace = true }

# platform.rs: continuous clock and boot ID (ADR-0005 §3.6). Unix: clock_gettime /
# mach_continuous_time / sysctlbyname through libc; Windows: QueryInterruptTime and
# the Session Manager BootId registry value through windows-sys.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# M03-U9: `Win32_Graphics_Gdi` gates `WNDCLASSW`/`RegisterClassW` (the session-lock
# message-only window, `session_lock/sys.rs`). A feature of the pinned crate only.
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi"] }

# M03 (ADR-0008 §18; dependencies.md §5): the session-lock source (U9).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }            # logind LockedHint + Lock/Unlock

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
core-foundation-sys = { workspace = true }

# ⟨M06 U56⟩ Embeds iroh in the transport (ADR-0012 §1 item 1): the serve child and the route
# helper's Iroh leg. The release builds' feature selection is the integrator's (heimdall).
[features]
default = []
iroh = ["heimdall-transport-iroh/iroh"]

[dev-dependencies]
# M03 wave 0 (A2-Q1): virtual time (`tokio::time::pause`) for the deterministic signing-gate and
# narrowing tests (U0b rows 20, 24). A feature of a pinned crate; no package enters the lock.
tokio = { workspace = true, features = ["test-util"] }
heimdall-testkit = { workspace = true, features = ["managed"] }
tempfile = { workspace = true }
# Gap G11: the U5t time-gate sweep is a fixed-seed proptest with Cutoff steps.
proptest = { workspace = true }

# M01-U5t time gate wiring: A08 cases through TimeGate + store.
[[test]]
name = "model_timegate"
path = "../../tests/model/timegate.rs"

# M01-U8a runtime foundations: paths, config, instance info, redaction, platform clock.
[[test]]
name = "integration_runtime"
path = "../../tests/integration/runtime.rs"

# ⟨M08 U2b-2⟩ The restore epoch and the replay fence through a real runtime (ADR-0014 §3.6
# steps 2 to 4; H9, H13): the server's check of every mutating form, the request ledger
# before the first store write, the fence by the full idempotency key, its retention, and the
# kept request-ID and epoch pair.
[[test]]
name = "integration_request_epoch"
path = "../../tests/integration/request_epoch.rs"

# M01-U5 application operations: A06/A19/A29 model cases and pipeline fault points.
[[test]]
name = "model_operations"
path = "../../tests/model/operations.rs"

# ⟨M05⟩ U2 (ADR-0011 §2.1, §3.1, §4; P9): owner policy actions, trust and reconcile
# decisions through a fake workspace probe, and the I1 invariant over random traces.
[[test]]
name = "model_trust_policy"
path = "../../tests/model/trust_policy.rs"

# ⟨M05⟩ U2 (ADR-0011 §4.2-§4.3; P10): concurrent scope-delta review, coalescing and the
# cooldown through the real Operations.
[[test]]
name = "model_decision_budget"
path = "../../tests/model/decision_budget.rs"

# ⟨M05⟩ U3 (ADR-0011 §7; plan §6.3 #3): block precedence over random traces (stop of a work
# and of a policy target, targeted pause and cutoff, resume and clear decisions, background
# triggers, restarts, ruling I-1).
[[test]]
name = "model_precedence_m05"
path = "../../tests/model/precedence_m05.rs"

# ⟨M05⟩ U3 (ADR-0011 §7; ruling I-1): the A05 and stop journeys and the reuse of a work ID's
# grant, in process through the real Operations.
[[test]]
name = "e2e_stop_m05"
path = "../../tests/e2e/m05_stop.rs"

# ⟨M05⟩ U7 (ADR-0011 §2.4 I4; A18): export and import of portable intent, `catalog
# set_default_profile`, through the real Operations (model suite) and the dispatcher (journey).
[[test]]
name = "integration_portable"
path = "../../tests/integration/portable.rs"

[[test]]
name = "e2e_portable_m05"
path = "../../tests/e2e/m05_portable.rs"

# M01-U5 events, cursors and subscriptions (A19 event cases).
[[test]]
name = "model_events"
path = "../../tests/model/events.rs"

# M02-U5 setup and catalog drivers (m02-plan U5): decisions, consent, held
# operations and their repairs, restart reconciliation, through the real Operations
# and the runtime's projection writer over a scratch home.
[[test]]
name = "model_setup"
path = "../../tests/model/setup.rs"

# M02-U5 end to end through the real dispatcher, sessions and service (m02-plan U5,
# M2-D08).
[[test]]
name = "e2e_setup_dispatch"
path = "../../tests/e2e/setup_dispatch.rs"

# M03 wave 0 (U0b rows 2-4, 9-12, 19, 21, 22): issuance, verification, ensure resolution, policy, catalog through the real Operations.
[[test]]
name = "model_operations_m03"
path = "../../tests/model/operations_m03.rs"

# M03 wave 0 (U0b rows 5, 7, 20, 25-27): signature authorization and the narrowing protocol through the real Operations.
[[test]]
name = "model_narrowing_m03"
path = "../../tests/model/narrowing_m03.rs"

# M03 wave 0 (U0b rows 6, 8, 13, 14, 17, 18, 23, 28): dispatch fail-closed landing, restart recovery, supervisor passes, procstat.
[[test]]
name = "integration_runtime_m03"
path = "../../tests/integration/runtime_m03.rs"

# M03-U9: the session-lock sources (fixture and native rows).
[[test]]
name = "integration_session_lock"
path = "../../tests/integration/session_lock.rs"

# M03-U7 connection control: owned masters, owned dedicated connections, the policies
# (m03-plan U7; ADR-0008 D8).
[[test]]
name = "integration_connections"
path = "../../tests/integration/connections.rs"

# ⟨M03⟩ wave 4 (U10): the issuer request handling and the verification gate
# (ADR-0008 D3, D4; §17.19 item 5, INT-Q13).
[[test]]
name = "integration_issuer_m03"
path = "../../tests/integration/issuer_m03.rs"

# ⟨M04⟩ U1 (m04-plan U1): the login entries against scratch roots (the per-platform round trip)
# and the setup item through the real Operations.
[[test]]
name = "integration_login_entry_m04"
path = "../../tests/integration/login_entry_m04.rs"

# ⟨M05⟩ U4 (ADR-0011 §2.2–§2.3): the real workspace observer over scratch files: symlinked
# roots, refused symlink/FIFO/device manifests, a manifest swapped by a concurrent writer,
# file identities.
[[test]]
name = "integration_workspace_observe"
path = "../../tests/integration/workspace_observe.rs"

# ⟨M05⟩ U4 (ADR-0011 §2.3, §3.2–§3.4, §4.1, §5.3): `ensure` with `context` in process, with
# the real probe over scratch Git repositories (A02, A04, A18, covered_only, mixed groups).
[[test]]
name = "e2e_context_m05"
path = "../../tests/e2e/m05_context.rs"

# ⟨M05⟩ U10 (spec A29; m05-plan U10): the A29 hostile-input suite in process: a
# prompt-injected agent with no terminal obeys a scratch Git repository's planted
# instructions against the production `Operations` and the real workspace observer.
[[test]]
name = "adversarial_prompt_injection"
path = "../../tests/adversarial/prompt_injection.rs"

# ⟨M06⟩ W2 (ADR-0012 §3.6–§3.11; m06-plan U1's W2 items): the runner runtime serving paired
# sessions through the real dispatcher and IPC session: runner mode and acceptance, the
# per-frame checks and revocation, the pending-session path (M06-W0-R06) and runner-local
# widening (T-RA1–T-RA4), with in-memory authorized_keys files and fixture public keys.
[[test]]
name = "integration_remote_runtime_m06"
path = "../../tests/integration/remote_runtime_m06.rs"

# ⟨M06⟩ W1 follow-up (M06-W0-R03; ADR-0006 §18.2 item 17): paired callers are client-scoped
# on every path (observe, cancel, bindings, snapshot, event pages, resumed and live
# subscriptions), with the local owner and the named narrowing power as controls. ⟨W2⟩ Moved
# here from heimdall-app: its live-event case runs through this crate's dispatcher override
# and the IPC session (the blocking W2 item).
[[test]]
name = "integration_paired_scope_m06"
path = "../../tests/integration/paired_scope_m06.rs"

# ⟨M06 U56⟩ (ADR-0012 §2.3-§2.4, §5.5; m06-plan U56): the serve child's supervision and the
# admission authority against real child processes of this test binary on loopback (no relays,
# no internet, no non-loopback bind): revocation applied only after the child closed the live
# connection, the unacknowledged suspend's exact-PID stop, the runtime killed mid-revocation
# (orphan exits, closure replayed before admission), unreadable authority, no verified store,
# and the route helper's Iroh leg. Fixture key stores only (mechanism evidence).
[[test]]
name = "integration_transport_supervise_m06"
path = "../../tests/integration/transport_supervise_m06.rs"
harness = false
required-features = ["iroh"]

# ⟨M06 U3⟩ (ADR-0012 §4; m06-plan U3): the runner runtime over a disposable runner store and
# per-run CAs: issuance pinned to its issuer with ADR-0005 §3.5 step 4's install checks, the
# designated time source on a virtual clock (non-designated, replayed, RTT-exceeded and
# cross-boot answers refused; never extends; never confirm_time; TIME_UNCERTAIN without a
# sample), readiness with the earliest bound and the residuals, and the A24 provenance row
# (scratch Unix sockets, `/usr/bin/env` with a cleared environment).
[[test]]
name = "integration_runner_runtime_m06"
path = "../../tests/integration/runner_runtime_m06.rs"

# ⟨M06 U3⟩ Issue and revoke linearization for runner delivery: every order of publish, the
# controller's revoke, the runner's tombstone, a runner narrowing and delivery.
[[test]]
name = "model_runner_delivery"
path = "../../tests/model/runner_delivery.rs"

# ⟨M06 U4⟩ (ADR-0012 §7; m06-plan U4 "model"): typed narrowing effects through the runner's
# real operations and the controller's real outbox and issuer barrier: two controllers'
# effects interleaved, a lost acknowledgement, a stale issuance against a tombstone, a pause
# over running grants, a cutoff delivered while disconnected, and a future cutoff delivered
# early, late and replayed under uncertain time.
[[test]]
name = "model_remote_sync"
path = "../../tests/model/remote_sync.rs"

# ⟨M06 U4, U4b⟩ (ADR-0012 §7.4-§7.5, §8; m06-plan U4 "adapter", U4b): resynchronization over a
# management session in process (uncertain time, the issuer's barrier after another
# controller's revoke, `held` on a changed identity), the paired dispatch path, and the T06
# set for a second controller.
[[test]]
name = "integration_runner_effects_m06"
path = "../../tests/integration/runner_effects_m06.rs"

# ⟨M06 W3 `driver`⟩ The controller's sync and issuance driver against the runner fixture: the
# per-session issuance gate, remote issuance behind the barrier, and the 2026-11-21 rulings.
[[test]]
name = "integration_controller_driver_m06"
path = "../../tests/integration/controller_driver_m06.rs"
