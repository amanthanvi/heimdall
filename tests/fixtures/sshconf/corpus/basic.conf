# inert, ssh -G only
# M02-U1 corpus: Host and Match patterns, wildcards and negation, first obtained value
# wins (ADR-0007 F1). Names are under .example (RFC 2606) and 192.0.2.0/24 (RFC 5737).
Host alpha
    HostName alpha.corpus.example
    Port 2201
    User corpus-alpha

Host *.corpus.example !bad.corpus.example
    User corpus-wild
    Port 2202

Host bad.corpus.example
    HostName 192.0.2.10

Match originalhost beta
    HostName beta.corpus.example

Match host "gamma*" !host gamma-excluded
    Port 2203

Match user corpus-explicit
    Port 2204

Host = delta
    HostName=delta.corpus.example
    Port = 2205

Host *
    User corpus-default
    Port 2299
