# inert, ssh -G only
# M02-U1 corpus: OpenSSH >= 8.7 argument splitting (crate::lex). Observed with ssh -G
# on OpenSSH_10.3p1 when this file was written: lex-hash HostName "a#b"; lex-quote User
# "u v"; lex-equals Port 2290 and User "=eq"; lex-escape User "a b"; lex-unknown-escape
# User "a\nb" (the backslash kept); lex-command RemoteCommand is the raw rest of the
# line, quotes and comment included. RemoteCommand runs only on a server, never here.
# M02 wave 2 (ADR-0007 section 12.15 item 2), observed on the same client: the three
# lex-command-* aliases print RemoteCommand "echo $X" (bare), "echo '$X'" (every `=` and
# blank after the keyword is skipped) and `echo "a b" c\ d # tail` (nothing removed).
# `crate::parse::Directive::raw` must equal each printed value.
Host lex-hash
    HostName a#b

Host lex-quote
    User "u v" # trailing comment

Host lex-equals
    Port=2290
    User==eq

Host lex-escape
    User a\ b

Host lex-unknown-escape
    User a\nb

Host lex-command
    RemoteCommand echo '$X'  "q"  # c

Host lex-command-bare
    RemoteCommand echo $X

Host lex-command-equals
    RemoteCommand = = echo '$X'

Host lex-command-escapes
    RemoteCommand echo "a b" c\ d # tail
