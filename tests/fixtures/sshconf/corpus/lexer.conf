# inert, ssh -G only
# M02-U1 corpus: OpenSSH >= 8.7 argument splitting (crate::lex). Observed with ssh -G
# on OpenSSH_10.3p1 when this file was written: lex-hash HostName "a#b"; lex-quote User
# "u v"; lex-equals Port 2290 and User "=eq"; lex-escape User "a b"; lex-unknown-escape
# User "a\nb" (the backslash kept); lex-command RemoteCommand is the raw rest of the
# line, quotes and comment included. RemoteCommand runs only on a server, never here.
Host lex-hash
    HostName a#b

Host lex-quote
    User "u v" # trailing comment

Host lex-equals
    Port=2290
    User==eq

Host lex-escape
    User a\ b

Host lex-unknown-escape
    User a\nb

Host lex-command
    RemoteCommand echo '$X'  "q"  # c
