# inert, ssh -G only
# M02-U1 corpus: nested includes and glob order (F3). The harness copies the corpus to
# scratch and replaces @CORPUS_DIR@ with that copy's absolute path; a relative Include
# would resolve under the account's ~/.ssh instead (S01 Include), which tests never read.
Include "@CORPUS_DIR@/include/nested/level1.conf"

Host nested-after
    Port 2401
