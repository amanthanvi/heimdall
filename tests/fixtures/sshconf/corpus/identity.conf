# inert, ssh -G only
# M02-U1 corpus: additive IdentityFile and CertificateFile (F2), IdentitiesOnly,
# IdentityAgent forms including Windows //./pipe/ (F14), %% (F7, F15), spaced and
# non-ASCII paths. Nothing here exists: ssh -G prints these values, it opens none.
Host ident-one
    IdentityFile /nonexistent/hm-corpus/id_one
    IdentitiesOnly yes

Host ident-*
    IdentityFile /nonexistent/hm-corpus/id_shared
    CertificateFile /nonexistent/hm-corpus/id_shared-cert.pub

Host ident-spaced
    IdentityFile "/nonexistent/hm corpus/id spaced"
    IdentityFile "/nonexistent/hm-corpus/id-ïdentité"

Host ident-percent
    IdentityFile /nonexistent/hm-corpus/100%%/id
    IdentityAgent /nonexistent/hm-corpus/agent%%.sock

Host ident-pipe
    IdentityAgent //./pipe/hm-corpus-agent

Host ident-pipe-quoted
    IdentityAgent "//./pipe/hm corpus agent"

Host ident-agent-none
    IdentityAgent none

Host ident-files-none
    IdentityFile none
