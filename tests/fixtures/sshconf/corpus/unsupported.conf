# inert, ssh -G only
# M02-U1 corpus: an unknown keyword covered by IgnoreUnknown, and an alias that S01
# documents as deprecated (ChallengeResponseAuthentication for
# KbdInteractiveAuthentication) and as a former name (HostbasedKeyTypes).
IgnoreUnknown HmCorpusUnknown*

Host unsupported
    HmCorpusUnknownOption yes
    ChallengeResponseAuthentication no
    HostbasedKeyTypes ssh-ed25519
    Port 2701
