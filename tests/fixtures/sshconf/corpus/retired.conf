# inert, ssh -G only
# M02-U1 corpus: obsolete spellings OpenSSH's keyword table accepts but the pinned
# manual does not list (directive::ALIASES Inferred, directive::OBSOLETE). Each is [I]
# until this file loads on a client; it is separate so that a client refusing one of
# them does not spoil the other corpus files.
Host retired
    PubkeyAcceptedKeyTypes ssh-ed25519
    Protocol 2
    UseRoaming no
    Port 2801
