# inert, ssh -G only
# M02-U1 corpus: include_state_is_restored_after_included_file (ADR-0007 section 3).
# The included file ends inside "Host state-other". If OpenSSH restores this file's
# section state after the include, "Port 2501" applies to state-alpha; otherwise it
# would apply only to state-other.
Host state-alpha
    Include "@CORPUS_DIR@/include/state/ends-in-host.conf"
    Port 2501

Host state-other
    Port 2599
