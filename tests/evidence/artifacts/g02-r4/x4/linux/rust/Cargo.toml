[package]
name = "x4spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Disposable G02 round-4 X4 Linux spike (Secret Service + kernel keyring)."

[[bin]]
name = "x4spike"
path = "src/main.rs"

# Second binary: same job through the keyring 4.x facade (Secret Service only).
[[bin]]
name = "x4spike-keyring"
path = "src/main_keyring.rs"
required-features = ["facade"]

[features]
default = ["backends"]
backends = ["dep:secret-service", "dep:linux-keyutils"]
facade = ["dep:keyring"]

# Exact pins; Cargo.lock is committed and builds use --locked.
[dependencies]
secret-service = { version = "=5.2.0", optional = true, default-features = false, features = ["rt-async-io-crypto-rust"] }
linux-keyutils = { version = "=0.2.5", optional = true, default-features = false, features = ["std"] }
keyring = { version = "=4.2.0", optional = true }

# Same profile as prototypes/rust (G02 frozen d8f0cbe).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
