# Heimdall production workspace (M01, M02, M03). See docs/architecture/overview.md for the
# crate map and docs/architecture/dependencies.md for every dependency decision.
#
# Every third-party version is pinned exactly ("=x.y.z") and Cargo.lock is
# committed; CI builds with --locked. Bumps are recorded decisions.

[workspace]
resolver = "3"
members = [
    "crates/contract",
    "crates/domain",
    "crates/store",
    "crates/app",
    "crates/ipc",
    "crates/runtime",
    "crates/testkit",
    "crates/heimdall",
    # M02 (m02-plan U0): the pure configuration-text crate, the local environment
    # (discovery, doctor, probes, projection transaction), the existing-access
    # adapters, and the process contract.
    "crates/sshconf",
    "crates/localenv",
    "crates/adapters",
    "crates/launch",
    # M03 (m03-plan §0.6, U0; ADR-0008 §18): the pure remote-registry protocol and
    # enrollment plan, the signer's key vault and endpoints, the issuer child and its
    # custody stores, and the enrollment I/O (client-executed steps, verification).
    "crates/registry",
    "crates/credential",
    "crates/issuer",
    "crates/enroll",
]

[workspace.package]
version = "0.1.0-m01"
edition = "2024"
rust-version = "1.99.1"
# The project license is an explicit release decision (spec §15.3, ADR-0001 §8).
# "UNLICENSED" is a placeholder, not a choice.
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# --- workspace crates -------------------------------------------------------
heimdall-contract = { path = "crates/contract" }
heimdall-domain = { path = "crates/domain" }
heimdall-store = { path = "crates/store" }
heimdall-app = { path = "crates/app" }
heimdall-ipc = { path = "crates/ipc" }
heimdall-runtime = { path = "crates/runtime" }
heimdall-testkit = { path = "crates/testkit" }
heimdall-sshconf = { path = "crates/sshconf" }
heimdall-localenv = { path = "crates/localenv" }
heimdall-adapters = { path = "crates/adapters" }
heimdall-launch = { path = "crates/launch" }
heimdall-registry = { path = "crates/registry" }
heimdall-credential = { path = "crates/credential" }
heimdall-issuer = { path = "crates/issuer" }
heimdall-enroll = { path = "crates/enroll" }

# --- serialization and schemas ---------------------------------------------
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: canonical JSON must print a parsed float back identically (wave-1 E3).
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
schemars = { version = "=1.2.3", features = ["derive", "jiff02"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }

# --- time ----------------------------------------------------------------------
# tzdb-zoneinfo: read the system zoneinfo database on Unix so named-zone human input
# can be diagnosed as ambiguous/nonexistent (wave-1 E9–E11); bundled on Windows.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "serde", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }

# --- async runtime and I/O -----------------------------------------------------
# process (M02, m02-plan U0): bounded local queries, probes and the Windows launcher.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros", "signal", "process"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["codec"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
async-trait = { version = "=0.1.92" }

# --- storage ---------------------------------------------------------------------
rusqlite = { version = "=0.41.1", features = ["bundled"] }

# --- SSH protocol types (signing endpoint framing; keys/certs arrive in M03) -------
ssh-agent-lib = { version = "=0.6.0", default-features = false }
# M03 (ADR-0008 §18; dependencies.md §5): ed25519 (K_env/K_verify/K_ca generation),
# encryption (D5 backup: bcrypt-pbkdf + aes256-ctr), rand_core (key generation takes a
# rand_core 0.6 RNG).
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519", "encryption", "rand_core"] }
ssh-encoding = { version = "=0.2.0", default-features = false, features = ["alloc"] }

# --- hashing, randomness, encoding ------------------------------------------------
sha2 = { version = "=0.10.9", default-features = false }
getrandom = { version = "=0.4.3" }
base64ct = { version = "=1.8.3", features = ["alloc"] }

# --- secret handling and custody stores (M03; ADR-0008 §18, dependencies.md §5) ------
# credential/issuer: SecretKey, SecretCaKey and passphrases zeroize on drop (D1).
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
# macOS only (issuer): login keychain. No default features (the OSX_* defaults are
# no-op markers).
security-framework = { version = "=3.7.0", default-features = false }
# macOS only (runtime session lock): CFDictionary/CFString/CFRunLoop and the
# CFNotificationCenter externs.
core-foundation = { version = "=0.10.1" }
core-foundation-sys = { version = "=0.8.7" }
# Linux only: the Secret Service client (issuer) and the one zbus (runtime: logind).
# secret-service 5.2.0 requires zbus ^5.
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

# --- errors and diagnostics -------------------------------------------------------
thiserror = { version = "=2.0.21" }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

# --- CLI and TUI --------------------------------------------------------------------
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0" }

# --- configuration text (M02) ------------------------------------------------------
# sshconf/localenv: OpenSSH `Include` glob expansion in bytewise order (m02-plan U0, U1).
glob = { version = "=0.3.4" }

# --- platform ------------------------------------------------------------------------
etcetera = { version = "=0.11.0" }
# runtime::platform: CLOCK_BOOTTIME / mach_continuous_time / kern.bootsessionuuid
# (ADR-0005 §3.6). Same version the lock already carries through tokio.
libc = { version = "=0.2.191", default-features = false, features = ["std"] }
# localenv (Unix): the atomic exchange and no-replace renames through the reviewed safe
# wrapper `fs::renameat_with` (Linux renameat2 RENAME_EXCHANGE/RENAME_NOREPLACE, macOS
# renameatx_np RENAME_SWAP/RENAME_EXCL), m02-plan §6 P5. The version the lock already
# carries through tempfile. Dev-only users add `pty`, `termios`, `process`.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    # M02 (m02-plan U0): kill-on-close job objects for probes, the console control
    # guard of the Windows launcher, the profile folder (account home, ADR-0007 F19).
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_UI_Shell",
    # M03 (ADR-0008 §18): DPAPI (issuer), WTS session lock + message-only window
    # (runtime), thread enumeration for CREATE_SUSPENDED/ResumeThread (localenv).
    "Win32_Security_Cryptography",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    # M03, not in ADR-0008 §18's list but needed by the named sys.rs modules
    # (dependencies.md §5; question D Q4): credential VirtualLock/VirtualUnlock,
    # runtime GetModuleHandleW for the window class.
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
] }

# --- test only -------------------------------------------------------------------------
proptest = { version = "=1.12.0" }
tempfile = { version = "=3.27.0" }

[workspace.lints.rust]
# Platform boundaries that need FFI opt in per module with #[allow(unsafe_code)] and a
# justification comment; the inventory is in docs/architecture/overview.md §9.
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
unimplemented = "warn"
# The M02 skeleton (m02-plan U0) marked unreachable unit bodies with
# todo!("M02-Uxx ..."); wave 3b removed the last one, so the lint denies again.
todo = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
