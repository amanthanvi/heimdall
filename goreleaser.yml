version: 2

project_name: heimdall

builds:
  - id: heimdall
    main: ./cmd/heimdall
    binary: heimdall
    ldflags:
      - "-s -w -X github.com/athanvi/heimdall/internal/cli.Version={{ .Version }} -X github.com/athanvi/heimdall/internal/cli.Commit={{ .Commit }} -X github.com/athanvi/heimdall/internal/cli.Date={{ .Date }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

release:
  github:
    owner: athanvi
    name: heimdall

